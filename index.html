<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Xtavgram — В разработке</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23555555'/%3E%3Cstop offset='0.5' stop-color='%23ffffff'/%3E%3Cstop offset='1' stop-color='%23999999'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%23141414'/%3E%3Cpath d='M14 50 L88 14 L54 88 L46 56 Z' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='M46 56 L88 14' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' opacity='0.85'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: #000;
    color: #fff;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Фоновое свечение */
  body::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 60%);
    pointer-events: none;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
    max-width: 400px;
    width: 100%;
    animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Логотип */
  .logo-wrap {
    width: 110px;
    height: 110px;
    background: linear-gradient(135deg, #0f0f0f 0%, #2a2a2a 50%, #0f0f0f 100%);
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.15);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
    animation: logoFloat 4s ease-in-out infinite;
  }

  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.2), transparent 55%);
    pointer-events: none;
  }

  .logo-wrap svg {
    width: 64%;
    height: 64%;
    position: relative;
    z-index: 1;
  }

  /* Название */
  .title {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -1.2px;
    margin-bottom: 14px;
  }

  .title span {
    color: #555;
  }

  /* Плашка "В разработке" */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffaa00;
    box-shadow: 0 0 10px #ffaa00;
    animation: dotPulse 1.5s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.75); }
  }

  /* Дата релиза */
  .release-date {
    font-size: 15px;
    color: #666;
    margin-bottom: 30px;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  .release-date b {
    color: #fff;
    font-weight: 700;
    font-size: 17px;
  }

  /* Описание */
  .description {
    color: #888;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 40px;
    max-width: 300px;
  }

  /* Кнопка Telegram */
  .tg-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    background: #fff;
    color: #000;
    text-decoration: none;
    padding: 17px 30px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    width: 100%;
    max-width: 300px;
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.25s;
    box-shadow: 0 8px 24px rgba(255,255,255,0.12);
    cursor: pointer;
  }

  .tg-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 12px 32px rgba(255,255,255,0.2);
  }

  .tg-btn:active {
    transform: scale(0.97);
  }

  .tg-btn svg {
    width: 22px;
    height: 22px;
    fill: #000;
    flex-shrink: 0;
  }

  /* Подпись */
  .footer {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    color: #333;
    font-size: 12px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }

  /* Адаптив */
  @media (max-height: 600px) {
    .logo-wrap { width: 80px; height: 80px; margin-bottom: 18px; }
    .title { font-size: 26px; }
    .description { margin-bottom: 24px; font-size: 14px; }
    .status-badge { margin-bottom: 14px; }
    .release-date { margin-bottom: 20px; }
  }
</style>
</head>
<body>

  <div class="container">
    <!-- Логотип -->
    <div class="logo-wrap">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="mainGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#555"/>
            <stop offset="0.5" stop-color="#fff"/>
            <stop offset="1" stop-color="#999"/>
          </linearGradient>
        </defs>
        <path d="M14 50 L88 14 L54 88 L46 56 Z" fill="none" stroke="url(#mainGrad)" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M46 56 L88 14" stroke="url(#mainGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
      </svg>
    </div>

    <!-- Название -->
    <div class="title">Xtav<span>gram</span></div>

    <!-- Плашка статуса -->
    <div class="status-badge">
      <div class="status-dot"></div>
      В разработке
    </div>

    <!-- Дата релиза -->
    <div class="release-date">
      Релиз: <b>10.11</b>
    </div>

    <!-- Описание -->
    <p class="description">
      Приложение находится на стадии активной разработки. Скоро всё заработает — следи за новостями!
    </p>

    <!-- Кнопка Telegram -->
    <a href="https://t.me/Xtavgram" target="_blank" rel="noopener noreferrer" class="tg-btn">
      <svg viewBox="0 0 24 24">
        <path d="M9.04 15.51l-.38 5.36c.54 0 .78-.24 1.06-.52l2.54-2.45 5.27 3.88c.97.53 1.66.25 1.92-.9L22.6 3.8c.31-1.42-.51-1.98-1.45-1.63L2.44 9.32c-1.39.54-1.37 1.32-.24 1.67l4.78 1.49 11.12-7c.52-.35 1-.16.6.19l-9 8.11z"/>
      </svg>
      Перейти в канал
    </a>
  </div>

  <!-- Подпись -->
  <div class="footer">© 2026 Xtavgram</div>

</body>
</html>
